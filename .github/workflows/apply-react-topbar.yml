name: Apply React topbar refactor

on:
  push:
    branches: [refactor/react-game-topbar]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply refactor
        run: python3 .github/apply-react-topbar.py

      - name: Remove temporary helpers
        run: rm .github/apply-react-topbar.py .github/workflows/apply-react-topbar.yml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate in-game topbar into React"
          git push
